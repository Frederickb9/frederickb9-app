<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de productos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Gestión de productos</h1>
  <p>Frederick Adrian Benavidez Flores - Puerto 8006</p>

  <h2 id="tituloFormulario">Registrar producto</h2>
  <form id="formulario">
    <input type="hidden" id="id">
    <input type="text" id="nombre" placeholder="Nombre" required>
    <input type="text" id="categoria" placeholder="Categoría" required>
    <input type="number" id="precio" placeholder="Precio" step="0.01" required>
    <input type="number" id="stock" placeholder="Stock" required>
    <button type="submit">Guardar</button>
    <button type="button" onclick="limpiar()">Cancelar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

<script>
const API = "/api/productos";
let lista = [];

async function cargarProductos() {
    const respuesta = await fetch(API);
    lista = await respuesta.json();

    document.getElementById("tabla").innerHTML = lista.map(p => `
        <tr>
            <td>${p.nombre}</td>
            <td>${p.categoria}</td>
            <td>${p.precio}</td>
            <td>${p.stock}</td>
            <td>
                <button onclick="editar('${p._id}')">Editar</button>
                <button onclick="eliminar('${p._id}')">Eliminar</button>
            </td>
        </tr>`).join("");
}

document.getElementById("formulario")
.addEventListener("submit", async e => {
    e.preventDefault();

    const id = document.getElementById("id").value;

    const datos = {
        nombre: document.getElementById("nombre").value.trim(),
        categoria: document.getElementById("categoria").value.trim(),
        precio: Number(document.getElementById("precio").value),
        stock: Number(document.getElementById("stock").value)
    };

    const respuesta = await fetch(
        id ? `${API}/${id}` : API,
        {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
        }
    );

    if (!respuesta.ok) {
        alert("No se pudo guardar el producto");
        return;
    }

    limpiar();
    cargarProductos();
});

function editar(id) {
    const p = lista.find(x => x._id === id);

    document.getElementById("id").value = p._id;
    document.getElementById("nombre").value = p.nombre;
    document.getElementById("categoria").value = p.categoria;
    document.getElementById("precio").value = p.precio;
    document.getElementById("stock").value = p.stock;

    document.getElementById("tituloFormulario").textContent =
        "Actualizar producto";
}

async function eliminar(id) {
    if (!confirm("¿Desea eliminar este producto?")) return;

    const respuesta = await fetch(`${API}/${id}`, {
        method: "DELETE"
    });

    if (!respuesta.ok) {
        alert("No se pudo eliminar");
        return;
    }

    cargarProductos();
}

function limpiar() {
    document.getElementById("formulario").reset();
    document.getElementById("id").value = "";
    document.getElementById("tituloFormulario").textContent =
        "Registrar producto";
}

cargarProductos();
</script>
</body>
</html>
